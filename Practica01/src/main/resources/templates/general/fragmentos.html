<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:fragment="head">
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">

        <title>Catálogo de Suculentas</title>

        <!-- Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
    </head>

    <body>

        <!-- Encabezado y menú -->
        <header th:fragment="header">

            <nav class="navbar navbar-expand-lg navbar-dark bg-success">

                <div class="container">

                    <a class="navbar-brand"
                       th:href="@{/suculenta/listado}">
                        🌵 Suculentas
                    </a>

                    <div class="navbar-nav">

                        <a class="nav-link"
                           th:href="@{/suculenta/listado}">
                            Listado
                        </a>

                        <a class="nav-link"
                           th:href="@{/suculenta/nuevo}">
                            Nueva Suculenta
                        </a>

                    </div>

                </div>

            </nav>

        </header>

        <!-- Pie de página -->
        <footer th:fragment="footer"
                class="bg-light text-center py-4 mt-5">

            <div class="container">

                <p class="mb-0">
                    🌵 Catálogo de Suculentas - Práctica 01
                </p>

            </div>

            <!-- Bootstrap JavaScript -->
            <script
                src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
            </script>

        </footer>

    </body>

</html>
