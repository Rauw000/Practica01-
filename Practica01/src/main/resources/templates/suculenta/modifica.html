<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>

        <header th:replace="~{general/fragmentos :: header}"></header>

        <main class="container mt-5">

            <div class="row justify-content-center">

                <div class="col-md-8">

                    <div class="card shadow">

                        <div class="card-header bg-success text-white">

                            <h3 class="mb-0"
                                th:text="${suculenta.idSuculenta == null}
                                ? 'Registrar Suculenta'
                                : 'Modificar Suculenta'">
                            </h3>

                        </div>

                        <div class="card-body">

                            <form th:action="@{/suculenta/guardar}"
                                  th:object="${suculenta}"
                                  method="post">

                                <!-- Identificador -->
                                <input type="hidden"
                                       th:field="*{idSuculenta}">

                                <!-- Nombre común -->
                                <div class="mb-3">

                                    <label class="form-label">
                                        Nombre común
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           th:field="*{nombreComun}"
                                           maxlength="100"
                                           required>

                                </div>

                                <!-- Nombre científico -->
                                <div class="mb-3">

                                    <label class="form-label">
                                        Nombre científico
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           th:field="*{nombreCientifico}"
                                           maxlength="150"
                                           required>

                                </div>

                                <!-- Familia -->
                                <div class="mb-3">

                                    <label class="form-label">
                                        Familia
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           th:field="*{familia}"
                                           maxlength="100">

                                </div>

                                <!-- Color principal -->
                                <div class="mb-3">

                                    <label class="form-label">
                                        Color principal
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           th:field="*{colorPrincipal}"
                                           maxlength="50">

                                </div>

                                <!-- Altura -->
                                <div class="mb-3">

                                    <label class="form-label">
                                        Altura en centímetros
                                    </label>

                                    <input type="number"
                                           class="form-control"
                                           th:field="*{alturaCm}"
                                           min="0"
                                           step="0.01">

                                </div>

                                <!-- Precio -->
                                <div class="mb-3">

                                    <label class="form-label">
                                        Precio estimado (₡)
                                    </label>

                                    <input type="number"
                                           class="form-control"
                                           th:field="*{precioEstimado}"
                                           min="0"
                                           step="0.01">

                                </div>

                                <!-- Nivel de riego -->
                                <div class="mb-3">

                                    <label class="form-label">
                                        Nivel de riego
                                    </label>

                                    <select class="form-select"
                                            th:field="*{nivelRiego}">

                                        <option value="">
                                            Seleccione una opción
                                        </option>

                                        <option value="Bajo">
                                            Bajo
                                        </option>

                                        <option value="Moderado">
                                            Moderado
                                        </option>

                                        <option value="Alto">
                                            Alto
                                        </option>

                                    </select>

                                </div>

                                <!-- URL de imagen -->
                                <div class="mb-3">

                                    <label class="form-label">
                                        URL de la imagen
                                    </label>

                                    <input type="url"
                                           class="form-control"
                                           th:field="*{rutaImagen}"
                                           maxlength="500"
                                           placeholder="https://ejemplo.com/imagen.jpg">

                                    <small class="text-muted">
                                        Ingrese una URL de imagen alojada en la nube.
                                    </small>

                                </div>

                                <!-- Botones -->
                                <div class="d-flex justify-content-between">

                                    <a th:href="@{/suculenta/listado}"
                                       class="btn btn-secondary">

                                        Cancelar

                                    </a>

                                    <button type="submit"
                                            class="btn btn-success">

                                        Guardar Suculenta

                                    </button>

                                </div>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </main>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>

    </body>

</html>
