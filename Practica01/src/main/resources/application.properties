spring.application.name=practica01

# Puerto del servidor
server.port=91

# Conexion a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/practica
spring.datasource.username=usuario_practica
spring.datasource.password=la_Clave
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuracion Thymeleaf
spring.thymeleaf.cache=false

# Configuracion de logs
logging.level.root=TRACE
logging.pattern.dateformat=dd HH:mm

# Desactivar banner de Spring
spring.main.banner-mode=off